name: Validate pull request

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: uv sync --locked

      - name: Create content-reader token
        id: content_reader
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.MODUL_DASHBOARD_APP_ID }}
          private-key: ${{ secrets.MODUL_DASHBOARD_APP_PRIVATE_KEY }}
          owner: AS-IO

      - name: Materialize registered content sources
        env:
          MODUL_DASHBOARD_CONTENT_TOKEN: ${{ steps.content_reader.outputs.token }}
        run: |
          uv run --locked python scripts/materialize_content_sources.py \
            --checkout-parent "$RUNNER_TEMP/modul-dashboard-sources"

      - name: Validate assembled tests and docs
        run: |
          uv run --locked python scripts/validate_assembled_content.py \
            --checkout-parent "$RUNNER_TEMP/modul-dashboard-sources" \
            --manifest-output "$RUNNER_TEMP/deployment-manifest.json" \
            --dashboard-repository "${{ github.repository }}"

      - name: Upload assembly manifest
        uses: actions/upload-artifact@v3.2.2-node20
        with:
          name: assembly-manifest
          path: ${{ runner.temp }}/deployment-manifest.json
          if-no-files-found: error
