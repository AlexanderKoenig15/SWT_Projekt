name: deploy mkdocs build to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - repositories.yaml
      - search-policy.yaml
      - scripts/**
      - theme/**
      - mkdocs.yml
      - pyproject.toml
      - uv.lock
  schedule:
    - cron: "0 6-21 * * *"
  workflow_dispatch:
    inputs:
      source_revisions:
        description: "Optional source-id=SHA values, one per line"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.decision.outputs.build_required }}
    steps:
      - name: Checkout scheduled revision
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for scheduled preflight
        if: github.event_name == 'schedule'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv for scheduled preflight
        if: github.event_name == 'schedule'
        run: python -m pip install uv

      - name: Sync scheduled preflight dependencies
        if: github.event_name == 'schedule'
        run: uv sync --locked

      - name: Create scheduled content-reader token
        if: github.event_name == 'schedule'
        id: content_reader
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.MODUL_DASHBOARD_APP_ID }}
          private-key: ${{ secrets.MODUL_DASHBOARD_APP_PRIVATE_KEY }}
          owner: AS-IO

      - name: Compare scheduled deployment inputs
        if: github.event_name == 'schedule'
        id: comparison
        env:
          MODUL_DASHBOARD_CONTENT_TOKEN: ${{ steps.content_reader.outputs.token }}
          PUBLISHED_MANIFEST_URL: https://pages.github.siemens.cloud/${{ github.repository }}/deployment-manifest.json
        run: |
          uv run --locked python scripts/deployment_preflight.py \
            --published-manifest-url "$PUBLISHED_MANIFEST_URL" \
            --dashboard-repository "${{ github.repository }}" \
            --dashboard-ref "${{ github.ref }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decision
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "build_required=${{ steps.comparison.outputs.build_required }}" >> "$GITHUB_OUTPUT"
          else
            echo "build_required=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
      PROJECT_ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues
      PROJECT_MILESTONES_URL: ${{ github.server_url }}/${{ github.repository }}/milestones
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: uv sync --locked

      - name: Create content-reader token
        id: content_reader
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.MODUL_DASHBOARD_APP_ID }}
          private-key: ${{ secrets.MODUL_DASHBOARD_APP_PRIVATE_KEY }}
          owner: AS-IO

      - name: Materialize registered content sources
        env:
          MODUL_DASHBOARD_CONTENT_TOKEN: ${{ steps.content_reader.outputs.token }}
          SOURCE_REVISIONS: ${{ inputs.source_revisions }}
        run: |
          source_arguments=()
          while IFS= read -r revision; do
            [[ -z "$revision" ]] && continue
            source_arguments+=(--revision "$revision")
          done <<< "$SOURCE_REVISIONS"
          uv run --locked python scripts/materialize_content_sources.py \
            --checkout-parent "$RUNNER_TEMP/modul-dashboard-sources" \
            "${source_arguments[@]}"

      - name: Validate assembled tests and docs
        run: |
          uv run --locked python scripts/validate_assembled_content.py \
            --checkout-parent "$RUNNER_TEMP/modul-dashboard-sources" \
            --manifest-output "$RUNNER_TEMP/deployment-manifest.json" \
            --dashboard-repository "${{ github.repository }}" \
            --dashboard-ref "${{ github.ref }}"

      - name: Publish deployment manifest in site output
        run: cp "$RUNNER_TEMP/deployment-manifest.json" site/deployment-manifest.json

      - name: Upload assembly manifest
        uses: actions/upload-artifact@v3.2.2-node20
        with:
          name: assembly-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment-manifest.json
          if-no-files-found: error

      - name: Fix file permissions
        run: |
          chmod -c -R +rX "site/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: site/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
